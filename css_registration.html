<!DOCTYPE html>
<html>

<head>
    <title>Online Book Store - Registration</title>

    <style>
        body {
            background-color: #FFF8DC;
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: darkred;
            font-style: italic;
            text-shadow: 2px 2px 5px gray;
        }

        h2 {
            text-align: center;
            color: darkgreen;
        }

        form {
            width: 400px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border: 2px solid gray;
            border-radius: 10px;
            box-shadow: 2px 2px 10px lightgray;
            text-align: left;
        }

        label {
            font-weight: bold;
            display: inline-block;
            width: 110px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"] {
            width: 230px;
            padding: 8px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        input[type="checkbox"] {
            margin-right: 5px;
        }

        input[type="submit"],
        input[type="reset"] {
            background-color: navy;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        input[type="submit"]:hover,
        input[type="reset"]:hover {
            background-color: darkred;
        }

        a {
            text-decoration: none;
            color: navy;
            font-weight: bold;
        }

        a:hover {
            color: darkred;
        }

        p {
            text-align: center;
            font-size: 18px;
        }

        hr {
            border: 1px solid gray;
        }

        .footer {
            text-align: center;
            background-color: #333;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>

</head>

<body>

    <h1>📚 Online Book Store - Registration 📚</h1>

    <hr>

    <h2>Customer Registration Form</h2>

    <form>

        <label>Name :</label>
        <input type="text" placeholder="Enter your name" required>
        <br><br>

        <label>Email :</label>
        <input type="email" placeholder="abc@gmail.com" required>
        <br><br>

        <label>Password :</label>
        <input type="password" placeholder="Create Password" required>
        <br><br>

        <label>Phone :</label>
        <input type="tel" placeholder="9XXXXXXXXX" required>
        <br><br>

        <input type="checkbox" required>
        I agree to the Terms and Conditions
        <br><br>

        <center>
            <input type="submit" value="Register">
            &nbsp;&nbsp;
            <input type="reset" value="Clear">
        </center>

    </form>

    <hr>

    <p>
        Already have an account?
        <a href="login.html">Login Here</a>
    </p>

    <div class="footer">
        © 2026 Online Book Store | All Rights Reserved
    </div>

</body>

</html>
